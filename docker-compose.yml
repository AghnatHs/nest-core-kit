services:
  postgres:
    image: postgres:18
    container_name: nest-core-kit-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nest-core-kit
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nest-core-kit"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
